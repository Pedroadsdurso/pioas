  <script>
    let userFirstName = "Cidadão";
    const urlParams = new URLSearchParams(window.location.search);
    const cpfParam = urlParams.get("cpf");
    const userNameBtn = document.getElementById("user-name");
    window.addEventListener("load", () => {
      setTimeout(() => {
        document.getElementById("loading-screen").classList.add("hidden");
      }, 1200);
      if (!cpfParam) {
        return;
      }
      fetch("https://apis-cpfapi.xb7m7k.easypanel.host/api/validar-cpf?cpf=" + cpfParam + "&token=04e2e9db6cebd40dc149f6520e7b901d")
        .then(res => res.json())
        .then(data => {
          if (data && data.NOME) {
            userFirstName = data.NOME.split(" ")[0];
          }
        })
        .catch(() => {})
        .finally(() => {
          userNameBtn.textContent = userFirstName;
        });
    });
  </script>
